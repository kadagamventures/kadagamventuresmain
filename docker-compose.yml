version: "3.9"

services:
  backend:
    build: ./backend
    container_name: kadagam-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.development

  client:
    build: ./client
    container_name: kadagam-client
    ports:
      - "5173:5173"
    depends_on:
      - backend